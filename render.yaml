# Render Blueprint: puts the Oakcraft Master SKU CRM online.
# In Render choose  New +  →  Blueprint  →  pick this GitHub repository  →  Apply.
# Render then creates the database and the web app, and gives you a public https address.
#
# Both start on Render's FREE plans so you can try it at no cost. Before real use, read DEPLOY.md:
# a free Render database is deleted about 30 days after it is created.

databases:
  - name: oakcraft-crm-db
    databaseName: oakcraft_crm
    user: oakcraft
    region: singapore
    plan: free            # for real use change to: 0.1c-256mb (smallest paid plan, keeps your data)

services:
  - type: web
    name: oakcraft-sku-crm
    runtime: node
    region: singapore
    plan: free            # sleeps after 15 idle minutes; change to 0.5c-512mb to keep it always on
    # --include=dev: the build tools (TypeScript, Tailwind, tsx) are dev dependencies.
    buildCommand: npm ci --include=dev && npm run build
    # db:setup creates the tables and the first admin on the first start, and is harmless afterwards.
    startCommand: npm run db:setup && npm start
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oakcraft-crm-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_NAME
        value: Admin
      # Render asks you for these two when you apply the Blueprint. They become your first login.
      # The password needs at least 8 characters with letters and numbers.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAX_UPLOAD_MB
        value: "30"
